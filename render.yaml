# Render Blueprint (human task H2): one static site built from this repo and published from dist/.
# Syntax checked against https://render.com/docs/blueprint-spec on 2026-11-25.
# The Content-Security-Policy below must match scripts/lib/headers.mjs (tests/engines/_repo.test.mjs checks).
services:
  - type: web
    runtime: static
    name: hsc-interactives
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Pull request previews (needs a plan that includes them; harmless otherwise).
    previews:
      generation: automatic
    envVars:
      # npm ci runs in buildCommand, so skip Render's own dependency install.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Node version for the build (also pinned in .node-version).
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors *; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Pages, the catalog and notes change often: always revalidate.
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /catalog.json
        name: Cache-Control
        value: no-cache
      # Vendored libraries and fonts only change with a dependency bump.
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=604800
