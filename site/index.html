<!doctype html>
<html lang="en-AU" data-theme="projector">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSC Interactives Hub</title>
  <meta name="description" content="Interactive simulations for NSW Stage 6 Extension Maths, Physics and Engineering Studies.">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/hub/hub.css">
</head>
<body class="hub">
  <a class="skip-link" href="#hub-catalog">Skip to the interactives</a>
  <header class="site-header hub-header">
    <a class="wordmark" href="/" data-site-name>HSC Interactives Hub</a>
    <div class="hsc-user" data-user></div>
  </header>
  <main class="container hub-main" id="hub-main">
    <section class="hub-hero" aria-labelledby="hub-greeting">
      <p class="hub-hero__eyebrow" data-hero-eyebrow></p>
      <h1 class="hub-greeting" id="hub-greeting" data-greeting>Welcome</h1>
      <p class="hub-sub" data-summary></p>
    </section>
    <div class="hub-layout">
      <aside class="hub-side" aria-label="Your workspace" data-side></aside>
      <section class="hub-catalog" id="hub-catalog" tabindex="-1" aria-label="Interactives">
        <div class="hub-filters" role="search" aria-label="Filter interactives" data-filters></div>
        <div class="hub-results" data-results></div>
        <div id="hub-grid" class="hub-sections" data-grid></div>
      </section>
    </div>
  </main>
  <footer class="site-footer hub-footer">
    <span data-site-credit>Built by Luca Brighenti for UNSW Teach the Teachers 2026</span>
    <span aria-hidden="true">·</span>
    <a href="/privacy.html">Privacy</a>
  </footer>
  <script type="module" src="/assets/hub/hub.js"></script>
</body>
</html>
