<!doctype html>
<html lang="en-AU" data-theme="projector">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>statsim engine demo · HSC Interactives Hub</title>
  <link rel="stylesheet" href="/assets/base.css">
</head>
<body>
  <!--
    Engine demo page (guide §9.1): mounts the statsim engine through the shell for each setup.
    Pick the setup with the #hash: #sampling, #normal-approx or #decay. Not linked from the hub.
  -->
  <script type="module">
    import { mountInteractive } from '/assets/shell.js';

    const { meta } = await import('/assets/engines/statsim/index.js');
    const wanted = location.hash.slice(1);
    const setup = meta.setups.includes(wanted) ? wanted : meta.setups[0];
    addEventListener('hashchange', () => location.reload());

    const CONFIG = {
      sampling: {
        // The flagship page's scenarios (me1-sampling-simulator) are included so stage checks cover them.
        presets: {
          default: {},
          binomial: { mode: 'binomial', n: 20, p: 0.3, samples: 1000 },
          'die-means': { mode: 'means', population: 'die', n: 5, samples: 2000 },
          'skewed-n30': { mode: 'means', population: 'skewed', n: 30, samples: 2000, meansAxis: 'zoom' },
          'binomial-relative': { mode: 'binomial', n: 20, p: 0.3, samples: 2000, drawRate: 200, seed: 2027, yScale: 'relative' },
          'coin-flips': { mode: 'binomial', n: 10, p: 0.5, samples: 200, drawRate: 5, seed: 2027, yScale: 'count' },
          'sample-proportion': { mode: 'means', population: 'bernoulli', p: 0.4, n: 25, samples: 5000, drawRate: 500, seed: 2027, meansAxis: 'zoom' },
          'dice-means': { mode: 'means', population: 'die', n: 5, samples: 5000, drawRate: 500, seed: 2027 },
          'exp-n30': { mode: 'means', population: 'exponential', rate: 1, n: 30, samples: 5000, drawRate: 500, seed: 2027 },
          'population-shape': { mode: 'means', population: 'skewed', n: 1, samples: 2000, drawRate: 500, seed: 2027 },
          'die-relative': { mode: 'means', population: 'die', n: 5, samples: 2000, yScale: 'relative' },
        },
        presetLabels: {
          default: 'Exponential population, n = 10',
          binomial: 'Bernoulli trials: B(20, 0.3)',
          'die-means': 'Means of 5 dice',
          'skewed-n30': 'Skewed population, n = 30, zoomed',
          'binomial-relative': 'B(20, 0.3), relative frequency',
          'coin-flips': 'Ten coin flips, drawn slowly',
          'sample-proportion': 'Proportion of successes, n = 25',
          'dice-means': 'Means of 5 dice, 5000 samples',
          'exp-n30': 'Exponential population, n = 30',
          'population-shape': 'Skewed population, n = 1',
          'die-relative': 'Means of 5 dice, relative frequency',
        },
        controls: ['mode', 'population', 'p', 'rate', 'n', 'samples', 'drawRate', 'meansAxis', 'yScale', 'showCurve', 'seed', 'timeScale'],
        readouts: ['count', 'latestX', 'latestMean', 'simMean', 'simSD', 'theoryMean', 'theorySD', 'popMean', 'popSD'],
        assumptions: ['Draws are independent', 'Seeded random numbers (mulberry32)', 'Simulated SD divides by (number of samples − 1)'],
      },
      'normal-approx': {
        // The page's scenarios (me1-normal-approx) are included so stage checks cover them.
        presets: {
          default: {},
          n100: { trials: 100, prob: 0.5, k: 55, event: 'ge' },
          'b30-le15': { trials: 30, prob: 0.4, event: 'le', k: 15, continuity: false },
          'upper-tail': { trials: 30, prob: 0.4, event: 'ge', k: 10, continuity: true },
          'large-n': { trials: 100, prob: 0.5, event: 'le', k: 55, continuity: true },
          skewed: { trials: 20, prob: 0.1, event: 'le', k: 2, continuity: true },
          'single-value': { trials: 50, prob: 0.3, event: 'eq', k: 15, continuity: false },
          'single-value-cc': { trials: 50, prob: 0.3, event: 'eq', k: 15, continuity: true },
        },
        presetLabels: {
          default: 'B(20, 0.3), P(X ≤ 6)',
          n100: 'B(100, 0.5), P(X ≥ 55)',
          'b30-le15': 'B(30, 0.4): P(X ≤ 15)',
          'upper-tail': 'Upper tail: P(X ≥ 10)',
          'large-n': 'Large n: B(100, 0.5), P(X ≤ 55)',
          skewed: 'Skewed: B(20, 0.1), P(X ≤ 2)',
          'single-value': 'Single value: B(50, 0.3), P(X = 15)',
          'single-value-cc': 'Single value, corrected',
        },
        controls: ['trials', 'prob', 'event', 'k', 'continuity'],
        readouts: ['exact', 'approx', 'error', 'mean', 'sd', 'z'],
        assumptions: ['Normal model Y ~ N(np, np(1 − p))', 'Exact values from the binomial formula'],
      },
      decay: {
        presets: { default: {}, coin: { nuclei: 400, halfLife: 1, duration: 10 }, smooth: { nuclei: 10000, halfLife: 10, duration: 60 } },
        presetLabels: { default: '1000 nuclei, H = 10 s', coin: 'Coin-toss model (H = 1 s)', smooth: '10 000 nuclei' },
        controls: ['nuclei', 'halfLife', 'duration', 'showCurve', 'seed', 'timeScale'],
        readouts: ['t', 'remaining', 'decayed', 'theoryRemaining', 'measuredHalfLife', 'probability', 'lastDecays'],
        assumptions: ['Each nucleus decays independently', 'Time step Δt = 1 s', 'p = 1 − 2^(−Δt/H) per step', 'No daughter decays'],
      },
    };
    const c = CONFIG[setup];

    mountInteractive({
      id: 'dev-statsim',
      title: `statsim · ${setup}`,
      engine: () => import('/assets/engines/statsim/index.js'),
      setup,
      presets: c.presets,
      presetLabels: c.presetLabels,
      controls: c.controls,
      readouts: c.readouts,
      assumptions: c.assumptions,
      prompts: [],
    }).then(() => {
      const nav = document.createElement('nav');
      nav.setAttribute('aria-label', 'Setups');
      nav.className = 'cluster';
      nav.style.cssText = 'gap: 8px; padding: 0 16px 16px; font-family: var(--f-mono); font-size: 14px;';
      for (const s of meta.setups) {
        const a = document.createElement('a');
        a.href = `#${s}`;
        a.textContent = s;
        if (s === setup) a.setAttribute('aria-current', 'page');
        nav.append(a);
      }
      const side = document.querySelector('.hsc-side');
      (side ?? document.body).prepend(nav);
    });
  </script>
</body>
</html>
